name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check Auth SDK installer
        run: npm run test:auth-sdk

      - name: Check hosting configuration
        run: node --test scripts/hosting-config.test.mjs scripts/security-headers.test.mjs

      - name: Build
        run: npm run build

      - name: Install browser test runtime
        run: npx --no-install playwright install --with-deps chromium

      - name: Check browser routes and payment entry
        run: npm run test:browser

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
